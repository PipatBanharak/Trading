  cfd_backtest_v1:                         # results/s1_results.json → mt5_cfd
    btc_swap_both_-18_gold_-6_-1: {portfolio_sharpe: 1.12, cagr: 0.0576, p_pos_3y_blended: 0.68}
    btc_swap_both_-10_gold_-3_0: {portfolio_sharpe: 1.27, cagr: 0.0662, p_pos_3y_blended: 0.71}
  broker_selection_rule: "เลือกโบรกเกอร์ที่ swap ทองฝั่ง long ต่ำ และมีสัญญาทองขนาดเล็ก ถ้าทุน < ~$46k"
