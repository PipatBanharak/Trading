# -----------------------------------------------------------------------------
# SCENARIOS (F29) — mixture: P(state)·P(criteria | SR_state)
#   SR ที่ใช้ = SR สุทธิใน live หลัง haircut; vol 10%; 3 ปี
# -----------------------------------------------------------------------------
scenarios:
  - id: SCN-A
    name: ซื้อ EA จาก marketplace / signal ทั่วไป
    states: [{p: 0.03, sr: 0.5, label: edge จริง}, {p: 0.97, sr: -0.5, label: ไม่มี edge + ต้นทุน}]
    prior_ref: PR-EDGE-MARKET-EA
    result: {CC-POSITIVE-3Y: 18.8, CC-LENIENT-3Y: 18.6, CC-STRICT-3Y: 0.4}
  - id: SCN-B
    name: สร้าง EA เอง ตลาดเดียว optimize ใน MT5 ไม่มี validation เชิงสถิติ
    states: [{p: 0.10, sr: 0.5}, {p: 0.90, sr: -0.3}]
    prior_ref: PR-EDGE-SIMPLE-TA
    result: {CC-POSITIVE-3Y: 32.9, CC-LENIENT-3Y: 32.5, CC-STRICT-3Y: 1.3}
  - id: SCN-D
    name: LLM agent ตัดสินใจเทรดเอง (แบบ Alpha Arena)
    states: [{p: 0.10, sr: 0.5}, {p: 0.90, sr: -0.5}]
    prior_ref: PR-EDGE-LLM-DISCRETIONARY
    result: {CC-POSITIVE-3Y: 23.1, CC-LENIENT-3Y: 22.9, CC-STRICT-3Y: 1.0}
  - id: SCN-C
    name: Pipeline เข้มงวด (DSR≥0.95, PBO≤0.2, WF, incubation 6–12 เดือน) + กระจาย trend/carry/MR + ¼–½ Kelly
    states: [{p: 0.60, sr: 0.8}, {p: 0.40, sr: -0.3}]
    prior_ref: [PR-EDGE-TREND, PR-EDGE-CARRY, PR-EDGE-LLM-HYBRID]
    result: {CC-POSITIVE-3Y: 65.3, CC-LENIENT-3Y: 64.9, CC-STRICT-3Y: 10.4}
  - id: SCN-C-PLUS
    name: SCN-C + ผ่าน live incubation แล้ว posterior สูงขึ้น
    states: [{p: 0.70, sr: 1.0}, {p: 0.30, sr: -0.3}]
    result: {CC-POSITIVE-3Y: 75.1, CC-LENIENT-3Y: 74.8, CC-STRICT-3Y: 17.8}
scenarios_reading_guide: >
  แม้ไม่มี edge เลย ก็ยังมีโอกาส ~17–28% ที่ 3 ปีจะ "บวก" จากโชค → ผลบวกช่วงสั้น
  ไม่ใช่หลักฐานของ edge. ความต่างที่แท้จริงอยู่ที่ CC-STRICT และขนาด SR

