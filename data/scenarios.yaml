# =============================================================================
# Scenarios & Precomputed Lookup Tables
# -----------------------------------------------------------------------------
# ตัวเลขทั้งหมดคำนวณจากสูตรใน formula_registry (data/schema.yaml)
# สมมติฐานร่วม: ผลตอบแทนรายวันเป็นอิสระต่อกัน (i.i.d.) ใกล้เคียง normal,
#   252 วันทำการ/ปี; ตาราง MC ใช้ 2,000–3,000 paths (คลาดเคลื่อน ~±1–2 จุด %)
# ใช้เป็น "ตารางอ้างอิงเร็ว" ก่อนมีโค้ดจริง
# =============================================================================

consistency_criteria:
  - id: CC-POSITIVE-3Y
    horizon_years: 3
    require_positive_total: true
  - id: CC-LENIENT-3Y
    horizon_years: 3
    require_positive_total: true
    max_drawdown: 0.25
  - id: CC-STRICT-3Y
    horizon_years: 3
    require_positive_total: true
    min_positive_years_frac: 1.0       # กำไรทุกปี
    min_positive_months_frac: 0.65     # กำไร ≥ 65% ของเดือน
    max_drawdown: 0.15

# -----------------------------------------------------------------------------
# T1 (F04) P(ผลรวมเป็นบวก | SR ต่อปี, ระยะเวลา) = Φ(SR·√T) — ไม่รวม volatility drag
# -----------------------------------------------------------------------------
T1_p_positive_by_sr_and_horizon:
  columns: [1_month, 3_months, 1_year, 3_years, 5_years, 10_years]
  rows:
    "SR 0.00": [50.0, 50.0, 50.0, 50.0, 50.0, 50.0]
    "SR 0.25": [52.9, 55.0, 59.9, 66.7, 71.2, 78.5]
    "SR 0.50": [55.7, 59.9, 69.1, 80.7, 86.8, 94.3]
    "SR 1.00": [61.4, 69.1, 84.1, 95.8, 98.7, 99.9]
    "SR 1.50": [66.7, 77.3, 93.3, 99.5, 100.0, 100.0]
    "SR 2.00": [71.8, 84.1, 97.7, 100.0, 100.0, 100.0]
    "SR 3.00": [80.7, 93.3, 99.9, 100.0, 100.0, 100.0]
  unit: percent

# -----------------------------------------------------------------------------
# T2 (binomial) P(กำไร ≥ k จาก 12 เดือน | SR) — "กำไรทุกเดือน" แทบเป็นไปไม่ได้
# -----------------------------------------------------------------------------
T2_p_k_of_12_months_positive:
  columns: [p_month, ">=7", ">=9", ">=10", ">=11", "12/12"]
  rows:
    "SR 0.5": [55.7, 54.8, 14.6, 4.7, 0.9, 0.1]
    "SR 1.0": [61.4, 70.1, 25.5, 9.9, 2.4, 0.3]
    "SR 1.5": [66.7, 82.4, 39.5, 18.3, 5.5, 0.8]
    "SR 2.0": [71.8, 90.9, 54.9, 29.9, 10.7, 1.9]
    "SR 3.0": [80.7, 98.4, 81.2, 58.2, 29.5, 7.6]
  unit: percent
  insight: >
    ถ้าเห็น EA ที่ "กำไรทุกเดือน" 12/12 ติดต่อกันหลายปี ทั้งที่ SR ระดับมืออาชีพ (1–2)
    ทำได้แค่ 0.3–1.9% ต่อปี → น่าสงสัยว่าเป็น martingale/grid ที่ซ่อน tail risk
    หรือข้อมูลถูกคัดเลือก

# -----------------------------------------------------------------------------
# T3 (F08) SR สูงสุดที่ "คาดว่าจะเจอจากโชคล้วน" เมื่อลอง N แบบ (SR จริง = 0)
# -----------------------------------------------------------------------------
T3_expected_max_sr_under_null:
  columns: [1_year, 2_years, 3_years, 5_years, 10_years]
  rows:
    "N=2":     [0.52, 0.37, 0.30, 0.23, 0.16]
    "N=5":     [1.19, 0.84, 0.69, 0.53, 0.38]
    "N=10":    [1.57, 1.11, 0.91, 0.70, 0.50]
    "N=20":    [1.90, 1.34, 1.10, 0.85, 0.60]
    "N=45":    [2.24, 1.58, 1.29, 1.00, 0.71]
    "N=100":   [2.53, 1.79, 1.46, 1.13, 0.80]
    "N=1000":  [3.26, 2.30, 1.88, 1.46, 1.03]
    "N=10000": [3.86, 2.73, 2.23, 1.73, 1.22]
  unit: annualized Sharpe
  insight: >
    MT5 optimizer ที่ลอง 10,000 combination บนข้อมูล 3 ปี จะเจอ SR ≈ 2.2 จาก noise ล้วน
    (ตรงกับ EV-BAILEY-MINBTL: N=45, 5 ปี → SR 1.0)

T3b_min_backtest_length_for_sr1:
  note: ปีขั้นต่ำของ backtest เพื่อให้ E[max SR | null] ≤ 1.0 (F12)
  rows: {"N=2": 0.27, "N=5": 1.42, "N=10": 2.48, "N=45": 5.0, "N=100": 6.4, "N=1000": 10.6}
  unit: years

# -----------------------------------------------------------------------------
# T4 (F10) Minimum Track Record Length — ต้องเห็นผลจริงกี่ปีถึงเชื่อได้ 95% ว่า SR>0
# -----------------------------------------------------------------------------
T4_min_track_record_years:
  columns: [normal, "skew -1 / kurt 10", "skew -3 / kurt 30"]
  rows:
    "SR 0.5": [10.83, 11.19, 11.93]
    "SR 1.0": [2.71, 2.90, 3.30]
    "SR 1.5": [1.21, 1.34, 1.63]
    "SR 2.0": [0.69, 0.79, 1.01]
    "SR 3.0": [0.31, 0.39, 0.55]
  unit: years (ข้อมูลรายวัน)

# -----------------------------------------------------------------------------
# T5 (F09) Deflated Sharpe: เห็น SR 1.5 บน backtest 3 ปี — เชื่อได้แค่ไหนเมื่อลองไป N แบบ
# -----------------------------------------------------------------------------
T5_dsr_example_sr1_5_3y:
  rows:
    "N=1":    {sr0: 0.00, dsr: 0.995}
    "N=10":   {sr0: 0.91, dsr: 0.846}
    "N=45":   {sr0: 1.29, dsr: 0.641}
    "N=100":  {sr0: 1.46, dsr: 0.527}
    "N=1000": {sr0: 1.88, dsr: 0.256}
  pass_threshold: 0.95

# -----------------------------------------------------------------------------
# T6 (F22) Kelly & drawdown: P(พอร์ตลดลงเหลือ x ของระดับปัจจุบัน ณ จุดใดในอนาคต)
# -----------------------------------------------------------------------------
T6_p_fall_to_fraction_by_kelly:
  columns: [x=0.9, x=0.8, x=0.7, x=0.5, x=0.2]
  rows:
    "c=2.0 (2x Kelly)":   [100, 100, 100, 100, 100]
    "c=1.0 (full Kelly)": [90.0, 80.0, 70.0, 50.0, 20.0]
    "c=0.5":              [72.9, 51.2, 34.3, 12.5, 0.8]
    "c=0.25":             [47.8, 21.0, 8.2, 0.8, 0.0]
  unit: percent
  note: >
    c=2 → growth rate = 0 (ไม่โตเลยในระยะยาว); >2 → ติดลบ.
    growth ที่ c: g(c) = (c − c²/2)·SR² → half-Kelly ได้ 75% ของ growth แต่ DD ลดลงมาก

# -----------------------------------------------------------------------------
# T7 (F23) Risk of Ruin: D = (max DD ที่ยอมได้)/(risk ต่อไม้) หน่วย R
# -----------------------------------------------------------------------------
T7_risk_of_ruin_percent:
  note: "ruin = ลดลงถึงขีดจำกัด DD; ขนาดไม้คงที่ (arithmetic)"
  cases:
    - setup: "win 50%, +1.5R / −1R"
      rows:
        "cost 0.0R (E=0.25)": {D10: 4.08, D20: 0.17, D30: 0.007, D50: 0.0}
        "cost 0.1R (E=0.15)": {D10: 14.66, D20: 2.15, D30: 0.32, D50: 0.007}
        "cost 0.2R (E=0.05)": {D10: 52.73, D20: 27.80, D30: 14.66, D50: 4.08}
    - setup: "win 40%, +2R / −1R"
      rows:
        "cost 0.0R (E=0.20)": {D10: 15.70, D20: 2.46, D30: 0.39, D50: 0.01}
        "cost 0.1R (E=0.10)": {D10: 39.62, D20: 15.70, D30: 6.22, D50: 0.98}
        "cost 0.2R (E=0.00)": {D10: 100, D20: 100, D30: 100, D50: 100}
    - setup: "win 55%, +1R / −1R"
      rows:
        "cost 0.0R (E=0.10)": {D10: 13.26, D20: 1.76, D30: 0.23, D50: 0.004}
        "cost 0.1R (E=0.00)": {D10: 100, D20: 100, D30: 100, D50: 100}
  example: "risk 1%/ไม้ และยอม DD 30% → D=30; risk 3%/ไม้ → D=10"

# -----------------------------------------------------------------------------
# T8 (F18) Martingale / Grid
# -----------------------------------------------------------------------------
T8_martingale:
  p_run_of_k_losses_within_n_trades:      # q = P(แพ้ต่อไม้)
    columns: [n=100, n=500, n=1000, n=5000]
    rows:
      "q=0.50 k=6":  [54.6, 98.3, 100.0, 100.0]
      "q=0.50 k=8":  [17.0, 62.5, 86.1, 100.0]
      "q=0.50 k=10": [4.4, 21.5, 38.5, 91.4]
      "q=0.52 k=8":  [21.9, 72.6, 92.6, 100.0]
      "q=0.52 k=10": [6.2, 29.1, 50.0, 96.9]
  per_cycle:
    "q=0.50 k=8":  {fail_pct: 0.391, cycles_to_ruin: 256, ev_per_cycle_units: 0.0}
    "q=0.52 k=8":  {fail_pct: 0.535, cycles_to_ruin: 187, ev_per_cycle_units: -0.369}
    "q=0.52 k=10": {fail_pct: 0.145, cycles_to_ruin: 692, ev_per_cycle_units: -0.480}
  insight: "win rate ต่อรอบ 99%+ แต่ EV = 0 (เกมยุติธรรม) หรือติดลบ (มี spread) — ruin เป็นเรื่องของ 'เมื่อไร' ไม่ใช่ 'ถ้า'"

# -----------------------------------------------------------------------------
# T9 (F24) Prop challenge: Phase1 +10% ก่อน −10%, Phase2 +5% ก่อน −10% (ไม่มีจำกัดเวลา,
#     ไม่รวม daily loss limit — ของจริงยากกว่านี้)
# -----------------------------------------------------------------------------
T9_prop_challenge_pass_pct:
  columns: [phase1, phase2, both]
  rows:
    "SR -1.0, vol 20%": [26.9, 49.4, 13.3]
    "SR -0.5, vol 20%": [37.8, 58.1, 21.9]
    "SR  0.0, any vol": [50.0, 66.7, 33.3]
    "SR  0.5, vol 10%": [73.1, 81.4, 59.5]
    "SR  0.5, vol 20%": [62.2, 74.6, 46.4]
    "SR  1.0, vol 10%": [88.1, 91.0, 80.1]
    "SR  1.0, vol 40%": [62.2, 74.6, 46.4]
    "SR  2.0, vol 10%": [98.2, 98.4, 96.6]
  insight: >
    อัตราผ่านจริง 5–14% (EV-PROP-FIRMS) ต่ำกว่ากรณี SR=0 (33%) มาก → ผู้เข้าแข่งขันเฉลี่ย
    มี edge ติดลบหลังต้นทุน และ/หรือเสี่ยงเกินจนชน daily limit. ถ้า edge จริง
    "vol ต่ำ" ช่วยเพิ่มโอกาสผ่าน (ตรงข้ามกับสัญชาตญาณที่อยากเร่งให้ถึงเป้า)

# -----------------------------------------------------------------------------
# T10 (F20) Bayes: P(edge จริง | ผ่านการทดสอบ)
# -----------------------------------------------------------------------------
T10_ppv:
  columns: ["α=0.05, power 0.8", "α=0.01, power 0.6", "α=0.003 (t≈3), power 0.5"]
  rows:
    "prior 1%":  [13.9, 37.7, 62.7]
    "prior 5%":  [45.7, 75.9, 89.8]
    "prior 10%": [64.0, 87.0, 94.9]
    "prior 20%": [80.0, 93.8, 97.7]
  familywise_false_positive_at_alpha_0_05:
    {N1: 5.0, N5: 22.6, N10: 40.1, N20: 64.2, N45: 90.1, N100: 99.4}
  caveat: "ใช้ได้เมื่อ α คือ α ที่ปรับ multiple testing แล้วจริง (DSR/SPA/FDR) — ไม่งั้น α จริงสูงกว่านี้มาก"

# -----------------------------------------------------------------------------
# T11 (F19) Diversification: กลยุทธ์ละ SR 0.5
# -----------------------------------------------------------------------------
